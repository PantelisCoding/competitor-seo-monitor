
name: Competitor SEO Monitoring

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: competitor-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run competitor scanner
        run: node scripts/monitorCompetitors.js

      - name: Commit updated monitoring data
        id: commit_data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/competitor-monitor.json

          if ! git diff --cached --quiet; then
            git commit -m "Update competitor SEO monitoring data"
            # An administrator may add/remove competitors during a scan.
            # Rebase the completed scan data on top of those configuration commits.
            pushed=false
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              sleep "$((attempt * 2))"
            done
            if [ "$pushed" != "true" ]; then
              echo "Could not push scan results after retries."
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No competitor changes detected."
          fi

      # Netlify (if selected later) rebuilds automatically on repository pushes.
      # Opt-in GitHub Pages deployment only when that workflow is configured.
      - name: Trigger optional GitHub Pages deployment
        if: steps.commit_data.outputs.changed == 'true' && vars.DEPLOY_GITHUB_PAGES == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
