
name: Competitor SEO Monitoring

on:
  schedule:
    - cron: "0 8 * * *"

  workflow_dispatch:
    inputs:
      send_test_email:
        description: "Send a test report even if no changes are detected"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: competitor-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Preserve previous monitoring snapshot
        shell: bash
        run: cp static/data/competitor-monitor.json "$RUNNER_TEMP/competitor-monitor-before.json"

      - name: Run competitor scanner
        run: node scripts/monitorCompetitors.js

      - name: Commit updated monitoring data
        id: commit_data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data/competitor-monitor.json

          if ! git diff --cached --quiet; then
            git commit -m "Update competitor SEO monitoring data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No competitor changes detected."
          fi

      - name: Email competitor changes with AgentMail
        env:
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          MONITOR_BEFORE_PATH: ${{ runner.temp }}/competitor-monitor-before.json
          FORCE_EMAIL_REPORT: ${{ inputs.send_test_email == true && 'true' || 'false' }}
        run: node scripts/sendEmailReport.js
